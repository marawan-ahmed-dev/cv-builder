<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCV Pro - صانع السير الذاتية الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #a855f7;
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body { background-color: #f0f2f5; padding: 20px; color: #1e293b; height: 100vh; overflow: hidden; }

        .app-container {
            display: flex;
            width: 100%;
            height: 95vh;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        html[dir="ltr"] .app-container { flex-direction: row-reverse; }

        .form-section {
            flex: 1;
            padding: 25px;
            background: #fafafa;
            overflow-y: auto;
            max-height: 100%;
        }

        html[dir="rtl"] .form-section { border-left: 2px solid #e2e8f0; }
        html[dir="ltr"] .form-section { border-right: 2px solid #e2e8f0; }

        .form-section h2 { 
            text-align: center; 
            margin-bottom: 20px; 
            background: var(--bg-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px;
        }

        .lang-switch-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #e2e8f0;
            padding: 5px;
            border-radius: 10px;
        }

        .lang-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            background: transparent;
            color: #475569;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: white;
            color: var(--primary-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #475569; font-size: 14px; }
        .form-group input[type="text"], .form-group input[type="email"], .form-group textarea, .form-group select, .form-group input[type="color"] {
            width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px;
            transition: 0.3s; font-size: 14px; background: white;
        }
        .form-group input[type="color"] { height: 40px; cursor: pointer; padding: 2px; }
        .form-group input[type="file"] { display: none; }
        
        .custom-file-upload {
            display: block; width: 100%; padding: 10px; background: var(--bg-gradient); color: white;
            text-align: center; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px;
            transition: 0.3s; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
        }
        .custom-file-upload:hover { opacity: 0.9; transform: scale(1.01); }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 5px rgba(99, 102, 241, 0.2); }
        .form-group textarea { height: 65px; resize: vertical; }
        
        .section-title { 
            margin-top: 20px; margin-bottom: 10px; padding: 6px;
            background: #f1f5f9; border-radius: 6px; color: var(--primary-color);
            font-weight: bold; font-size: 14px;
        }
        html[dir="rtl"] .section-title { border-right: 4px solid var(--primary-color); }
        html[dir="ltr"] .section-title { border-left: 4px solid var(--primary-color); }

        .template-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .template-grid button {
            padding: 8px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: bold; color: white; transition: 0.3s; font-size: 13px;
        }
        .btn-classic { background: #475569; }
        .btn-center { background: #3b82f6; }
        .btn-modern { background: #6366f1; }
        .btn-colorful { background: #ec4899; }
        .btn-coder { background: #0f172a; }
        .btn-doctor { background: #06b6d4; }
        .btn-student { background: #f59e0b; }
        .template-grid button:hover { opacity: 0.85; transform: scale(1.02); }

        .preview-section {
            flex: 1; padding: 30px; background: #f8fafc;
            display: flex; flex-direction: column; justify-content: space-between;
            overflow-y: auto; max-height: 100%;
        }

        .resume-preview {
            background: white; padding: 35px; width: 100%; border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08); margin-bottom: 15px;
            transition: 0.3s ease;
        }

        .resume-preview.no-border { border: none !important; }

        html[dir="rtl"] .resume-preview { text-align: right; direction: rtl; }
        html[dir="ltr"] .resume-preview { text-align: left; direction: ltr; }

        .header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e2e8f0; }
        .cv-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #cbd5e1; display: none; flex-shrink: 0; }
        
        .header-info { flex-grow: 1; }
        #outEmail, #outAddress { font-size: 14px; color: #0f172a; font-weight: 600; margin-top: 4px; }

        .classic-template { font-family: 'Times New Roman', serif; border: 2px solid #000; border-top: 8px solid #000; color: #000 !important; }
        .classic-template h1, .classic-template h3, .classic-template p, .classic-template span, .classic-template div { color: #000 !important; }
        .classic-template .header { border-bottom: 2px solid #000; }
        
        .center-template { border: 2px solid #3b82f6; border-radius: 16px; }
        .center-template .header { justify-content: center; text-align: center; background: #eff6ff; padding: 20px; border-radius: 12px; }
        .center-template .header-info { text-align: center; }

        .modern-template { border: 2px solid #6366f1; border-top: 10px solid #6366f1; }
        .modern-template .header { background: #f8fafc; padding: 15px; border-radius: 8px; }

        .colorful-template { border: 3px dashed #ec4899; background: #fdf2f8; }
        .colorful-template h1 { color: #ec4899; }
        .colorful-template h3 { color: #ec4899; }

        .coder-template { background: #0f172a; color: #38bdf8; border: 2px solid #38bdf8; border-radius: 12px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .coder-template h1 { color: #f8fafc; font-size: 22px; font-weight: bold; }
        .coder-template .header { border-bottom: 2px solid #38bdf8; }
        .coder-template .cv-section h3 { margin-bottom: 6px; text-transform: uppercase; color: #38bdf8; font-weight: 700; }
        .coder-template .cv-item { line-height: 1.5; white-space: pre-line; color: #cbd5e1; font-weight: 500; }
        .coder-template #outEmail, .coder-template #outAddress { color: #38bdf8; }

        .doctor-template { border: 2px solid #06b6d4; border-radius: 4px 16px 16px 4px; }
        html[dir="rtl"] .doctor-template { border-right: 10px solid #06b6d4; }
        html[dir="ltr"] .doctor-template { border-left: 10px solid #06b6d4; }
        .doctor-template h1, .doctor-template h3 { color: #0891b2; }

        .student-template { border: 3px solid #f59e0b; border-radius: 20px; background: #fffdf5; }
        .student-template .header { background: #fffbeb; padding: 15px; border-radius: 12px; }

        .cv-section { margin-bottom: 16px; }
        .cv-section h3 { margin-bottom: 6px; text-transform: uppercase; color: #0f172a; font-weight: 700; }
        .cv-item { line-height: 1.5; white-space: pre-line; color: #1e293b; font-weight: 500; }

        .action-btns { display: flex; gap: 10px; }
        .save-btn, .print-btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .save-btn { background: #10b981; }
        .save-btn:hover { background: #059669; }
        .print-btn { background: var(--bg-gradient); }
        .print-btn:hover { opacity: 0.9; }

        @media print {
            @page { size: auto; margin: 0mm; }
            body, html { padding: 0 !important; margin: 0 !important; background: white !important; height: 100% !important; overflow: visible !important; }
            .form-section, .action-btns, .lang-switch-box { display: none !important; }
            .app-container { display: block !important; width: 100% !important; height: 100% !important; border: none !important; box-shadow: none !important; background: white !important; }
            .preview-section { padding: 15mm !important; background: white !important; overflow: visible !important; max-height: none !important; display: block !important; }
            .resume-preview { box-shadow: none !important; margin: 0 !important; width: 100% !important; border-radius: 0 !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="form-section">
            <h2>EasyCV Pro</h2>
            
            <div class="lang-switch-box">
                <button class="lang-btn active" id="btnAr" onclick="changeLang('ar')">العربية</button>
                <button class="lang-btn" id="btnEn" onclick="changeLang('en')">English</button>
            </div>

            <div class="section-title" id="t-base">البيانات الأساسية</div>
            <div class="form-group">
                <label id="l-img">الصورة الشخصية</label>
                <label for="inImg" class="custom-file-upload" id="uploadLabel">اختر صورة شخصية</label>
                <input type="file" id="inImg" accept="image/*">
            </div>
            <div class="form-group">
                <label id="l-name">الاسم الكامل</label>
                <input type="text" id="inName" placeholder="الاسم ثلاثي">
            </div>
            <div class="form-group">
                <label id="l-email">البريد الإلكتروني</label>
                <input type="email" id="inEmail" placeholder="example@mail.com">
            </div>

            <div class="section-title" id="t-prof">المحتوى المهني</div>
            <div class="form-group" id="groupJob">
                <label id="l-job">المسمى الوظيفي</label>
                <input type="text" id="inJob" placeholder="مثلاً: مبرمج جافاسكريبت">
            </div>
            <div class="form-group">
                <label id="l-about">نبذة عني</label>
                <textarea id="inAbout" placeholder="اكتب نبذة عنك هنا..."></textarea>
            </div>
            <div class="form-group">
                <label id="l-edu">التعليم</label>
                <textarea id="inEdu" placeholder="اكتب تفاصيل تعليمك هنا..."></textarea>
            </div>
            <div class="form-group">
                <label id="l-exp">الخبرات العملية</label>
                <textarea id="inExp" placeholder="اكتب خبراتك هنا..."></textarea>
            </div>

            <div class="section-title" id="t-skills">المهارات والإضافات</div>
            <div class="form-group">
                <label id="l-skills">المهارات</label>
                <input type="text" id="inSkills" placeholder="مهارة 1, مهارة 2...">
            </div>
            <div class="form-group">
                <label id="l-cert">الشهادات</label>
                <textarea id="inCert" placeholder="الشهادات التدريبية..."></textarea>
            </div>
            <div class="form-group">
                <label id="l-lang">اللغات</label>
                <input type="text" id="inLang" placeholder="العربية، الإنجليزية...">
            </div>
            <div class="form-group">
                <label id="l-address">مكان السكن</label>
                <input type="text" id="inAddress" placeholder="المدينة، الدولة">
            </div>

            <div class="section-title" id="t-fontOpts">تحكم حجم الخط</div>
            <div class="form-group">
                <label id="l-headingSize">حجم خط العناوين</label>
                <select id="inHeadingSize" onchange="updateHeadingSize()">
                    <option value="13px">صغير</option>
                    <option value="15px" selected>متوسط</option>
                    <option value="18px">كبير</option>
                    <option value="21px">كبير جداً</option>
                </select>
            </div>
            <div class="form-group">
                <label id="l-bodySize">حجم خط الشرح والمحتوى</label>
                <select id="inBodySize" onchange="updateBodySize()">
                    <option value="12px">صغير</option>
                    <option value="14px" selected>متوسط</option>
                    <option value="16px">كبير</option>
                    <option value="18px">كبير جداً</option>
                </select>
            </div>

            <div id="colorfulOptionsGroup" style="display:none;">
                <div class="section-title" id="t-colorOpts">خيارات ألوان القالب الملون</div>
                <div class="form-group">
                    <label id="l-colorTitle">لون خط العناوين (اسمك وعناوين الأقسام)</label>
                    <input type="color" id="inColorTitle" value="#ec4899" onchange="updateColorfulTheme()">
                </div>
                <div class="form-group">
                    <label id="l-colorBorder">لون الإطار</label>
                    <input type="color" id="inColorBorder" value="#ec4899" onchange="updateColorfulTheme()">
                </div>
                <div class="form-group">
                    <label id="l-colorBody">لون الشرح والمحتوى</label>
                    <input type="color" id="inColorBody" value="#1e293b" onchange="updateColorfulTheme()">
                </div>
            </div>

            <div class="section-title" id="t-template">اختر التصميم</div>
            <div class="template-grid">
                <button class="btn-classic" id="b-classic" onclick="setT('classic')">كلاسيكي</button>
                <button class="btn-center" id="b-center" onclick="setT('center')">قالب المركز</button>
                <button class="btn-modern" id="b-modern" onclick="setT('modern')">حديث</button>
                <button class="btn-colorful" id="b-colorful" onclick="setT('colorful')">ملون</button>
                <button class="btn-coder" id="b-coder" onclick="setT('coder')">مبرمجين</button>
                <button class="btn-doctor" id="b-doctor" onclick="setT('doctor')">أطباء</button>
                <button class="btn-student" id="b-student" onclick="setT('student')">طلاب</button>
            </div>

            <div class="section-title" id="t-borderOpts">خيارات الإطار</div>
            <div class="template-grid">
                <button style="background: #10b981;" id="btnWithBorder" onclick="setBorder(true)">إطار</button>
                <button style="background: #64748b;" id="btnNoBorder" onclick="setBorder(false)">بدون إطار</button>
            </div>
        </div>

        <div class="preview-section">
            <div class="resume-preview classic-template" id="resume">
                <div class="header">
                    <img id="outImg" class="cv-img" src="" alt="الصورة الشخصية">
                    <div class="header-info">
                        <h1 id="outName" style="font-size: 22px; font-weight: bold;">اسمك هنا</h1>
                        <p id="outEmail" style="color: inherit;">Email@example.com</p>
                    </div>
                </div>

                <div class="cv-section" id="sec-job" style="display:none;">
                    <h3 id="h-job">المسمى الوظيفي</h3>
                    <p id="outJob" class="cv-item" style="font-weight: 700;"></p>
                </div>

                <div class="cv-section" id="sec-about" style="display:none;">
                    <h3 id="h-about">نبذة تعريفية</h3>
                    <p id="outAbout" class="cv-item"></p>
                </div>

                <div class="cv-section" id="sec-edu" style="display:none;">
                    <h3 id="h-edu">التعليم</h3>
                    <p id="outEdu" class="cv-item"></p>
                </div>

                <div class="cv-section" id="sec-exp" style="display:none;">
                    <h3 id="h-exp">الخبرة العملية</h3>
                    <p id="outExp" class="cv-item"></p>
                </div>

                <div class="cv-section" id="sec-skills" style="display:none;">
                    <h3 id="h-skills">المهارات</h3>
                    <p id="outSkills" class="cv-item"></p>
                </div>

                <div class="cv-section" id="sec-cert" style="display:none;">
                    <h3 id="h-cert">الشهادات</h3>
                    <p id="outCert" class="cv-item"></p>
                </div>

                <div class="cv-section" id="sec-lang" style="display:none;">
                    <h3 id="h-lang">اللغات</h3>
                    <p id="outLang" class="cv-item"></p>
                </div>

                <div class="cv-section" id="sec-address" style="display:none;">
                    <h3 id="h-addressSection">مكان السكن</h3>
                    <p id="outAddress" style="color: inherit;" class="cv-item"></p>
                </div>
            </div>
            
            <div class="action-btns">
                <button class="save-btn" id="saveBtnText" onclick="saveDataLocally()">حفظ السيرة محلياً</button>
                <button class="print-btn" id="printBtnText" onclick="window.print()">تحميل PDF</button>
            </div>
        </div>
    </div>

    <script>
        let base64Image = "";

        const mappings = [
            ['inName', 'outName'], ['inEmail', 'outEmail'],
            ['inJob', 'outJob', 'sec-job'],
            ['inAbout', 'outAbout', 'sec-about'], ['inEdu', 'outEdu', 'sec-edu'], 
            ['inExp', 'outExp', 'sec-exp'], ['inSkills', 'outSkills', 'sec-skills'], 
            ['inCert', 'outCert', 'sec-cert'], ['inLang', 'outLang', 'sec-lang'],
            ['inAddress', 'outAddress', 'sec-address']
        ];

        mappings.forEach(item => {
            const [inId, outId, secId] = item;
            const inputElem = document.getElementById(inId);
            const outputElem = document.getElementById(outId);
            
            inputElem.addEventListener('input', (e) => {
                outputElem.innerText = e.target.value;
                if (secId) {
                    const section = document.getElementById(secId);
                    section.style.display = e.target.value.trim() === '' ? 'none' : 'block';
                }
            });
        });

        document.getElementById('inImg').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const currentLang = document.getElementById('htmlRoot').getAttribute('dir');
                document.getElementById('uploadLabel').innerText = currentLang === 'rtl' ? "تم اختيار الصورة: " + file.name : "Image Selected: " + file.name;
                const reader = new FileReader();
                reader.onload = function() {
                    base64Image = reader.result;
                    const img = document.getElementById('outImg');
                    img.src = base64Image;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        function saveDataLocally() {
            const cvData = {
                name: document.getElementById('inName').value,
                email: document.getElementById('inEmail').value,
                job: document.getElementById('inJob').value,
                about: document.getElementById('inAbout').value,
                edu: document.getElementById('inEdu').value,
                exp: document.getElementById('inExp').value,
                skills: document.getElementById('inSkills').value,
                cert: document.getElementById('inCert').value,
                lang: document.getElementById('inLang').value,
                address: document.getElementById('inAddress').value,
                image: base64Image
            };

            localStorage.setItem('savedCVData', JSON.stringify(cvData));
            alert("تم حفظ السيرة الذاتية على جهازك بنجاح");
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('savedCVData');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('inName').value = data.name || '';
                document.getElementById('outName').innerText = data.name || 'اسمك هنا';
                
                document.getElementById('inEmail').value = data.email || '';
                document.getElementById('outEmail').innerText = data.email || 'Email@example.com';
                
                document.getElementById('inJob').value = data.job || '';
                document.getElementById('outJob').innerText = data.job || '';
                if(data.job) document.getElementById('sec-job').style.display = 'block';

                document.getElementById('inAbout').value = data.about || '';
                document.getElementById('outAbout').innerText = data.about || '';
                if(data.about) document.getElementById('sec-about').style.display = 'block';

                document.getElementById('inEdu').value = data.edu || '';
                document.getElementById('outEdu').innerText = data.edu || '';
                if(data.edu) document.getElementById('sec-edu').style.display = 'block';

                document.getElementById('inExp').value = data.exp || '';
                document.getElementById('outExp').innerText = data.exp || '';
                if(data.exp) document.getElementById('sec-exp').style.display = 'block';

                document.getElementById('inSkills').value = data.skills || '';
                document.getElementById('outSkills').innerText = data.skills || '';
                if(data.skills) document.getElementById('sec-skills').style.display = 'block';

                document.getElementById('inCert').value = data.cert || '';
                document.getElementById('outCert').innerText = data.cert || '';
                if(data.cert) document.getElementById('sec-cert').style.display = 'block';

                document.getElementById('inLang').value = data.lang || '';
                document.getElementById('outLang').innerText = data.lang || '';
                if(data.lang) document.getElementById('sec-lang').style.display = 'block';

                document.getElementById('inAddress').value = data.address || '';
                document.getElementById('outAddress').innerText = data.address || '';
                if(data.address) document.getElementById('sec-address').style.display = 'block';

                if (data.image) {
                    base64Image = data.image;
                    const img = document.getElementById('outImg');
                    img.src = base64Image;
                    img.style.display = 'block';
                }
            }
        });

        function setT(t) {
            const res = document.getElementById('resume');
            const hasNoBorder = res.classList.contains('no-border');
            
            res.removeAttribute('style');
            res.querySelector('h1').removeAttribute('style');
            res.querySelectorAll('.cv-section h3').forEach(h => h.removeAttribute('style'));
            res.querySelectorAll('.cv-item').forEach(item => item.removeAttribute('style'));
            const outEmailElem = document.getElementById('outEmail');
            const outAddressElem = document.getElementById('outAddress');
            if(outEmailElem) outEmailElem.removeAttribute('style');
            if(outAddressElem) outAddressElem.removeAttribute('style');

            res.className = 'resume-preview ' + t + '-template';
            if (hasNoBorder) res.classList.add('no-border');
            
            const colorGroup = document.getElementById('colorfulOptionsGroup');
            if (t === 'colorful') {
                colorGroup.style.display = 'block';
                updateColorfulTheme();
            } else {
                colorGroup.style.display = 'none';
            }
            
            if (t === 'classic') res.style.fontFamily = "'Times New Roman', serif";
            updateHeadingSize();
            updateBodySize();
        }

        function setBorder(hasBorder) {
            const res = document.getElementById('resume');
            if (hasBorder) res.classList.remove('no-border');
            else res.classList.add('no-border');
        }

        function updateHeadingSize() {
            const size = document.getElementById('inHeadingSize').value;
            document.querySelectorAll('.cv-section h3').forEach(h => h.style.fontSize = size);
        }

        function updateBodySize() {
            const size = document.getElementById('inBodySize').value;
            document.querySelectorAll('.cv-item').forEach(item => item.style.fontSize = size);
        }

        function updateColorfulTheme() {
            const res = document.getElementById('resume');
            if (!res.classList.contains('colorful-template')) return;

            const cTitle = document.getElementById('inColorTitle').value;
            const cBorder = document.getElementById('inColorBorder').value;
            const cBody = document.getElementById('inColorBody').value;
            
            const h1 = res.querySelector('h1');
            if (h1) h1.style.color = cTitle;

            res.querySelectorAll('.cv-section h3').forEach(h3 => h3.style.color = cTitle);
            res.style.border = "3px dashed " + cBorder;

            res.querySelectorAll('.cv-item').forEach(item => item.style.color = cBody);
            const outEmailElem = document.getElementById('outEmail');
            const outAddressElem = document.getElementById('outAddress');
            if(outEmailElem) outEmailElem.style.color = cBody;
            if(outAddressElem) outAddressElem.style.color = cBody;
        }
